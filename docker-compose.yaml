services:
  migrate:
    build: .
    command: [python, -m, dashulya.main.migrations]
    environment:
      MIGRATION_DATABASE_URL: postgresql://dashulya:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/dashulya
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      OWNER_USER_ID: ${OWNER_USER_ID:?Set OWNER_USER_ID in .env}
      PUBLIC_GROUP_IDS: ${PUBLIC_GROUP_IDS:-}
      OWNER_AUTHOR_IDS: ${OWNER_AUTHOR_IDS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      KEENABLE_API_KEY: ${KEENABLE_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_DECISION_MODEL: ${OPENAI_DECISION_MODEL:-gpt-6-luna}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Moscow}
      DATABASE_URL: postgresql://dashulya_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/dashulya
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      LOG_PATH: /var/log/dashulya/dashulya.log
    volumes:
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - ./var/logs:/var/log/dashulya
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: pgvector/pgvector@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_USER: dashulya
      POSTGRES_DB: dashulya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dashulya -d dashulya"]
      interval: 3s
      timeout: 3s
      retries: 20
